apiVersion: apps/v1
kind: Deployment
metadata:
  name: fyh-k8s-docker-hub-demo
  labels:
    app: fyh-k8s-docker-hub-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fyh-k8s-docker-hub-demo
  template:
    metadata:
      labels:
        app: fyh-k8s-docker-hub-demo
    spec:
      containers:
        - name: app
          image: ffyyhh995511/fyh-k8s-docker-hub-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9981
---
apiVersion: v1
kind: Service
metadata:
  name: fyh-k8s-docker-hub-demo
spec:
  type: NodePort
  selector:
    app: fyh-k8s-docker-hub-demo
  ports:
    - port: 9981
      targetPort: 9981
      nodePort: 30981
